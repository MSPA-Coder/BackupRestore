# Sandbox de ensaio do BackupRestore.
#
# Existe por um motivo só: dar um PostgreSQL descartável onde restaurações são
# testadas. Nenhuma restauração deste projeto pode apontar para os contêineres
# reais (conforto-termico-postgres-1, mega-sena-postgres-1,
# controle-bancario-postgres-1, controle-renda-variavel-db-1) — restaurar.py
# aceita exclusivamente o alvo descartável abaixo.
#
# Também serve de caixa de ferramentas para `pg_restore --list`. Os dumps são
# enviados pelo processo do host à entrada padrão de `docker exec`; o sandbox
# não monta nem enxerga a pasta de backups.
#
#   docker compose -f compose.yaml up -d
#   docker compose -f compose.yaml down -v     (descarta tudo)

name: backuprestore-sandbox

services:
  quality:
    image: backuprestore-quality:local
    build:
      context: .
      dockerfile: Dockerfile.test
      pull: true
    profiles: [quality]
    pull_policy: never
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
    network_mode: none
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: "2.0"
    environment:
      HOME: /tmp
      PIP_CACHE_DIR: /tmp/pip-cache
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=128m

  audit:
    image: backuprestore-quality:local
    profiles: [quality]
    pull_policy: never
    command: ["pip-audit", "--progress-spinner=off", "--cache-dir", "/tmp/pip-audit-cache"]
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g
    cpus: "2.0"
    environment:
      HOME: /tmp
      PIP_CACHE_DIR: /tmp/pip-cache
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=128m

  sandbox:
    image: mspa-postgres:17-alpine
    build:
      context: ./docker/sandbox-postgres
      dockerfile: Dockerfile
      pull: true
      no_cache: true
    pull_policy: build
    container_name: backuprestore-sandbox
    # A releitura dos dumps do VPS depende dele: se o Docker reinicia e o
    # sandbox fica parado, a sincronização reprova dumps sadios (05/10/2026).
    restart: unless-stopped
    user: postgres
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=64m
      - /var/run/postgresql:rw,nosuid,nodev,noexec,mode=1777,size=16m
    environment:
      # Credenciais descartáveis: este banco nunca guarda nada que importe.
      POSTGRES_DB: sandbox
      POSTGRES_USER: sandbox
      POSTGRES_PASSWORD: sandbox_descartavel
      TZ: America/Sao_Paulo
    # 5439 para não colidir com 5432-5435, já usadas pelos projetos reais.
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - sandbox_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox -d sandbox"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    stop_grace_period: 30s
    pids_limit: 256
    # Mantém folga para os ensaios sem deixar um dump defeituoso consumir toda
    # a memória disponível ao Docker Desktop.
    mem_limit: 768m
    cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  sandbox_data:
