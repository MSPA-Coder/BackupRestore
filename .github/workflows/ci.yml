name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.x"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q .

      # O Dependabot abre PR quando sai versão nova. Não é a mesma pergunta que
      # "a versão que está instalada AGORA tem CVE conhecido?" — e essa segunda
      # ninguém fazia em nenhum dos seis repositórios.
      #
      # Instalado aqui e não no `requirements.txt` de propósito: aquele arquivo
      # é o que a ferramenta precisa para RODAR na máquina do mantenedor.
      # Ferramenta de CI não tem por que ser instalada junto com ela.
      #
      # Reprova em qualquer achado. Vulnerabilidade sem correção publicada sai
      # por `--ignore-vuln <ID>` com comentário dizendo por quê: cada exceção
      # vira decisão explícita e datada, em vez de um vermelho permanente que
      # se aprende a ignorar.
      - name: Auditar dependências instaladas (CVE conhecido)
        run: |
          python -m pip install "pip-audit>=2.10,<3"
          pip-audit --progress-spinner=off
