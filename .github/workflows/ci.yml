name: CI

on:
  push:
    branches: [main]
  # Sem filtro de `branches`, de proposito: assim a verificacao roda em PR para
  # QUALQUER base, e nao so para `main`.
  #
  # Com o filtro, um PR empilhado sobre outro branch nao disparava check
  # nenhum -- e o sintoma e a ausencia de sinal, nao um vermelho: a pagina do
  # PR fica limpa e parece aprovada. Aconteceu na fase F1.
  #
  # O `push` acima continua restrito a `main`: o que interessa la e o estado
  # do branch que a producao espelha.
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Docker Python 3.15
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validar Compose
        run: docker compose config --quiet
      - name: Construir quality com Python 3.15 atualizado
        run: docker compose --profile quality build --pull --no-cache quality
      - name: Executar testes e compilação no contêiner
        run: docker compose --profile quality run --rm --no-deps quality
      # Reprova CVEs corrigíveis. Exceções precisam ser explícitas e datadas.
      - name: Auditar dependências instaladas (CVE conhecido)
        run: docker compose --profile quality run --rm --no-deps audit

      - name: Construir a imagem PostgreSQL derivada atualizada
        run: docker compose build --pull --no-cache sandbox
      - name: Analisar CVEs corrigíveis na imagem PostgreSQL
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/trivy-cache"
          chmod 777 "$RUNNER_TEMP/trivy-cache"
          docker save mspa-postgres:17-alpine -o "$RUNNER_TEMP/imagem.tar"
          chmod 644 "$RUNNER_TEMP/imagem.tar"
          docker compose -f .github/docker-compose.yml run --rm trivy \
            --cache-dir /tmp/trivy-cache \
            image --input /varredura/imagem.tar \
                  --scanners vuln \
                  --severity HIGH,CRITICAL \
                  --ignore-unfixed \
                  --exit-code 1 \
                  --format table
      - name: Analisar CVEs corrigíveis na imagem de qualidade
        run: |
          set -euo pipefail
          docker save backuprestore-quality:local -o "$RUNNER_TEMP/quality.tar"
            chmod 644 "$RUNNER_TEMP/quality.tar"
          docker compose -f .github/docker-compose.yml run --rm trivy \
            --cache-dir /tmp/trivy-cache \
            image --input /varredura/quality.tar \
                  --scanners vuln \
                  --severity HIGH,CRITICAL \
                  --ignore-unfixed \
                  --exit-code 1 \
                  --format table
