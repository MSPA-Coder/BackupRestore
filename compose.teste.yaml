# Sandbox de ensaio do BackupRestore.
#
# Existe por um motivo só: dar um PostgreSQL descartável onde restaurações são
# testadas. Nenhuma restauração deste projeto pode apontar para os contêineres
# reais (conforto-termico-postgres-1, mega-sena-postgres-1,
# controle-bancario-postgres-1, controle-renda-variavel-db-1) — motor.py
# recusa esses nomes por lista, e este é o alvo permitido.
#
# Acumula um segundo papel: o host não tem pg_restore instalado (e não deve
# ter). Este contêiner enxerga a pasta de backup em /backups somente leitura e
# serve de caixa de ferramentas para validar artefatos com `pg_restore --list`.
#
#   docker compose -f compose.teste.yaml up -d
#   docker compose -f compose.teste.yaml down -v     (descarta tudo)

name: backuprestore-sandbox

services:
  sandbox:
    image: postgres:17-alpine
    container_name: backuprestore-sandbox
    user: postgres
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,mode=1777,size=64m
      - /var/run/postgresql:rw,nosuid,nodev,noexec,mode=1777,size=16m
    environment:
      # Credenciais descartáveis: este banco nunca guarda nada que importe.
      POSTGRES_DB: sandbox
      POSTGRES_USER: sandbox
      POSTGRES_PASSWORD: sandbox_descartavel
      TZ: America/Sao_Paulo
    # 5439 para não colidir com 5432-5435, já usadas pelos projetos reais.
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - sandbox_data:/var/lib/postgresql/data
      - "C:/Users/MSPA/Dropbox/Programacao/Backups/BackupRestore:/backups:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandbox -d sandbox"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    stop_grace_period: 30s
    pids_limit: 256
    # O maior ensaio atual restaura o ConfortoTermico (~353 mil linhas). O
    # limite fica muito acima do uso observado (~25 MiB), sem deixar um dump
    # defeituoso consumir toda a memoria do Docker Desktop.
    mem_limit: 768m
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  sandbox_data:
